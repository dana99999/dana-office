# office.dananine.com 배포 — 서버 한 대에 한 번만 실행하면 됨
#   cp deploy/.env.example deploy/.env  →  값 채우기
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  office:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    volumes:
      - office-data:/app/data          # SQLite + 업로드 파일 (컨테이너 재시작해도 유지)
    expose: ["3000"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data                # Let's Encrypt 인증서 자동 발급·갱신
      - caddy-config:/config
    depends_on: [office]

volumes:
  office-data:
  caddy-data:
  caddy-config:
